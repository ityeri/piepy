[project]
name = "pie_py"
version = "0.0.1"
authors = [
  { name="ityeri", email="ityeri9@gmail.com" },
]
description = "파이봇"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICENSE"]

[tool.poetry]
name = "pie_py"
version = "0.0.1"
description = "파이봇"
authors = ["ityeri <ityeri9@gmail.com>"]
packages = [{ include = "pie_py", from = "src" }]

[tool.poetry.dependencies]
discord-py = "^2.6.4"
yspy = {git = "https://github.com/ityeri/yspy.git"}
dotenv = "^0.9.9"
pymysql = "^1.1.2"
pillow = "^12.0.0"
sqlalchemy = "^2.0.44"
prompt-toolkit = "^3.0.52"
pytubefix = "^10.3.6"
hgtk = "^0.2.1"
fsspec = "^2025.12.0"
six = "^1.17.0"
aiomysql = "^0.3.2"
cryptography = "^46.0.3"
greenlet = "^3.3.0"
[project.urls]
Homepage = "https://github.com/ityeri/pie_py"
Issues = "https://github.com/ityeri/pie_py/issues"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"